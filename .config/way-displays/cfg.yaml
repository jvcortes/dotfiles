ARRANGE: ROW
ALIGN: TOP
ORDER:
  - eDP-1
  - DP-1
  - HDMI-A-1
SCALING: FALSE
AUTO_SCALE: FALSE
AUTO_SCALE_MIN: 1
AUTO_SCALE_MAX: -1
MODE:
  - NAME_DESC: eDP-1
    WIDTH: 1920
    HEIGHT: 1080
    HZ: 60
  - NAME_DESC: DP-1
    WIDTH: 2560
    HEIGHT: 1440
    HZ: 75
  - NAME_DESC: HDMI-A-1
    WIDTH: 2560
    HEIGHT: 1440
    HZ: 60
CALLBACK_CMD: notify-send "way-displays ${CALLBACK_LEVEL}" "${CALLBACK_MSG}"
LOG_THRESHOLD: INFO
VRR_OFF:
  - 'M27Q X'
  - '0x1542'
